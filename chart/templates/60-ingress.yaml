apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shorty-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: dev.shorty.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
