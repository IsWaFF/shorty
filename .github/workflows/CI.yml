name: ci
on:
    push:
        branches: [main]
permissions:
    contents: read
    packages: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: login to ghcr
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: build dockerfile
              run: |
                  docker build -t ghcr.io/iswaff/shorty:${GITHUB_SHA::7} .
                  docker push ghcr.io/iswaff/shorty:${GITHUB_SHA::7}
