apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shorty
  labels:
    app: gunicorn
spec:
  selector:
    app: gunicorn
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shorty
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
