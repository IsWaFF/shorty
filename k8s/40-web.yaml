apiVersion: apps/v1
kind: Deployment
metadata:
  name: shorty-gunicorn
  namespace: shorty
  labels:
    app: gunicorn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gunicorn
  template:
    metadata:
      labels:
        app: gunicorn
    spec:
      containers:
        - name: gunicorn
          image: ghcr.io/iswaff/shorty:0.1
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
          livenessProbe:
            httpGet:
              port: http
              path: /healthz
          readinessProbe:
            httpGet:
              port: http
              path: /readyz
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
